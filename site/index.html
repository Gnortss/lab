<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lab · devsoup</title>
  <style>
    :root {
      --bg: #f7f6f3; --fg: #1c1c1c; --muted: #6b6b6b; --card: #fff; --border: #e3e1dc; --accent: #d9622b;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --fg: #ececec; --muted: #9a9a9a; --card: #1d1d1d; --border: #2c2c2c; --accent: #f08a4b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 3rem 1rem; }
    header h1 { margin: 0; font-size: 2rem; }
    header h1 a { color: var(--accent); text-decoration: none; }
    header p { margin: .25rem 0 2rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .card { display: block; padding: 1rem 1.25rem; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .card p { margin: 0 0 .75rem; color: var(--muted); font-size: .95rem; }
    .ext { color: var(--accent); font-weight: normal; }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; padding: 0; list-style: none; }
    .tags li { font-size: .75rem; padding: .1rem .5rem; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>lab<span style="color:var(--muted)">.</span><a href="https://devsoup.xyz">devsoup</a></h1>
      <p>Demos, visualizations, calculators and small games I've built along the way.</p>
    </header>
    <div class="grid"><!-- CARDS --></div>
  </main>
</body>
</html>
